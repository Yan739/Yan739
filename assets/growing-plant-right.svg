<svg viewBox="0 0 300 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Climbing plant, grows once, reaches the top">
  <style>
    .ink-line { stroke: #171512; }
    .ink-fill { stroke: #171512; fill: #171512; }
    @media (prefers-color-scheme: dark) {
      .ink-line { stroke: #F2B705; }
      .ink-fill { stroke: #F2B705; fill: #F2B705; }
    }
  </style>
  <defs>
    <path id="leaf" d="M0,0 C11,-17 11,-36 0,-52 C-11,-36 -11,-17 0,0 Z" />
    <path id="chakraSwirl" d="M0,0 C9,-2 13,6 7,11 C1,16 -8,12 -8,3 C-8,-7 3,-13 12,-7" fill="none" stroke-linecap="round" />
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8792B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E8792B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Plays once on load, then stays fully grown -->
  <g id="plant">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" />

    <g transform="translate(300,0) scale(-1,1)">
    <!-- pot -->
    <path class="ink-fill" d="M118,1196 L182,1196 L172,1170 L128,1170 Z" opacity="0.9" />
    <ellipse class="ink-fill" cx="150" cy="1170" rx="27" ry="5" opacity="0.55" />

    <!-- climbing stem, spans the full height of the panel -->
    <path
      id="stem"
      d="M150,1170 C170,1151 170,1169 140,1150 C130,1112 130,1130 160,1092 C170,1054 170,1072 140,1034 C130,996 130,1014 160,976 C170,938 170,956 140,918 C130,880 130,898 160,860 C170,822 170,840 140,802 C130,764 130,782 160,744 C170,706 170,724 140,686 C130,648 130,666 160,628 C170,590 170,608 140,570 C130,532 130,550 160,512 C170,474 170,492 140,454 C130,416 130,434 160,396 C170,358 170,376 140,338 C130,300 130,318 160,280 C170,242 170,260 140,222 C130,184 130,202 160,164 C170,126 170,144 140,106 C130,54 130,72 160,20"
      class="ink-line" fill="none" stroke-width="4" stroke-linecap="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
    >
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="9.3s" fill="freeze" />
    </path>

    <!-- leaves, revealed in sequence as the stem reaches their height, then held -->
    <g opacity="0" transform="translate(168,1150) rotate(-32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.55s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-32;-26;-32" additive="sum" dur="2.60s" begin="0.90s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(132,1092) rotate(34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.00s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="34;28;34" additive="sum" dur="2.75s" begin="1.35s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

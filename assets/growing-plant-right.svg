<svg viewBox="0 0 300 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Climbing plant, grows once, full length, mirrored" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ink-line { stroke: #171512; }
    .ink-fill { stroke: #171512; fill: #171512; }
    @media (prefers-color-scheme: dark) {
      .ink-line { stroke: #F2B705; }
      .ink-fill { stroke: #F2B705; fill: #F2B705; }
    }
  </style>
  <defs>
    <path id="leaf" d="M0,0 C11,-17 11,-36 0,-52 C-11,-36 -11,-17 0,0 Z" />
    <path id="chakraSwirl" d="M0,0 C9,-2 13,6 7,11 C1,16 -8,12 -8,3 C-8,-7 3,-13 12,-7" fill="none" stroke-linecap="round" />
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8792B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E8792B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Plays once on load, then stays fully grown -->
  <g id="plant">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" />

    <g transform="translate(300,0) scale(-1,1)">
    <!-- pot -->
    <path class="ink-fill" d="M118,892 L182,892 L172,866 L128,866 Z" opacity="0.9" />
    <ellipse class="ink-fill" cx="150" cy="866" rx="27" ry="5" opacity="0.55" />

    <!-- climbing stem, now spanning the full length of the panel -->
    <path
      id="stem"
      d="M150,866 C130,810 170,770 150,718 C130,666 170,626 150,574
         C132,526 168,488 150,440 C132,392 168,354 150,306
         C134,264 166,228 150,180 C136,144 164,112 150,74
         C141,50 158,28 150,10"
      class="ink-line" fill="none" stroke-width="4" stroke-linecap="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
    >
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="7s" fill="freeze" />
    </path>

    <!-- leaves, revealed in sequence as the stem reaches their height, then held -->
    <g opacity="0" transform="translate(146,877) rotate(-42)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-45;-39;-45" additive="sum" dur="3.1s" begin="0.9s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(170,819) rotate(38)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.05s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="35;41;35" additive="sum" dur="2.7s" begin="1.4s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(138,759) rotate(-36)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-38;-32;-38" additive="sum" dur="3.4s" begin="1.95s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(165,699) rotate(40)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.15s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="37;43;37" additive="sum" dur="2.9s" begin="2.5s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(140,639) rotate(-32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.7s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-34;-28;-34" additive="sum" dur="3.2s" begin="3.05s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(163,579) rotate(36)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.25s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="33;39;33" additive="sum" dur="2.8s" begin="3.6s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(142,519) rotate(-35)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.8s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-37;-31;-37" additive="sum" dur="3.0s" begin="4.15s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(165,459) rotate(39)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.35s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="36;42;36" additive="sum" dur="2.6s" begin="4.7s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(140,385) rotate(-33)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.9s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-35;-29;-35" additive="sum" dur="3.1s" begin="5.25s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(163,325) rotate(37)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.45s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="34;40;34" additive="sum" dur="2.9s" begin="5.8s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(142,265) rotate(-34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="6.0s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-36;-30;-36" additive="sum" dur="3.2s" begin="6.35s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <!-- chakra swirl accents: abstract nod to the Naruto energy motif, not a reproduction of any show artwork -->
    <g opacity="0" transform="translate(178,150)">
      <animate attributeName="opacity" from="0" to="0.9" dur="0.4s" begin="6.5s" fill="freeze" />
      <circle r="16" fill="url(#glow)" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" begin="6.5s" repeatCount="indefinite" />
        <use href="#chakraSwirl" stroke="#E8792B" stroke-width="2.5" />
      </g>
    </g>

    <g opacity="0" transform="translate(146,193) rotate(-34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="6.65s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-36;-30;-36" additive="sum" dur="3.3s" begin="6.9s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(160,135) rotate(32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="6.9s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="29;35;29" additive="sum" dur="3s" begin="7.15s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <!-- final small chakra flare marking the top of the vine -->
    <g opacity="0" transform="translate(150,12)">
      <animate attributeName="opacity" from="0" to="0.9" dur="0.4s" begin="7.2s" fill="freeze" />
      <circle r="18" fill="url(#glow)" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.6s" begin="7.2s" repeatCount="indefinite" />
        <use href="#chakraSwirl" stroke="#F2B705" stroke-width="2.5" />
      </g>
    </g>
    </g>
  </g>
</svg>

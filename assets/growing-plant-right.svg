<svg viewBox="0 0 300 1150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Climbing plant, grows once, full length">
  <style>
    .ink-line { stroke: #171512; }
    .ink-fill { stroke: #171512; fill: #171512; }
    @media (prefers-color-scheme: dark) {
      .ink-line { stroke: #F2B705; }
      .ink-fill { stroke: #F2B705; fill: #F2B705; }
    }
  </style>
  <defs>
    <path id="leaf" d="M0,0 C11,-17 11,-36 0,-52 C-11,-36 -11,-17 0,0 Z" />
    <path id="chakraSwirl" d="M0,0 C9,-2 13,6 7,11 C1,16 -8,12 -8,3 C-8,-7 3,-13 12,-7" fill="none" stroke-linecap="round" />
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8792B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E8792B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Plays once on load, then stays fully grown -->
  <g id="plant">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" />

    <g transform="translate(300,0) scale(-1,1)">
    <!-- pot -->
    <path class="ink-fill" d="M118,1142 L182,1142 L172,1116 L128,1116 Z" opacity="0.9" />
    <ellipse class="ink-fill" cx="150" cy="1116" rx="27" ry="5" opacity="0.55" />

    <!-- climbing stem, same gentle tapering S-curve as before, just longer -->
    <path
      id="stem"
      d="M150,1116 C130,1058 170,1017 150,964 C130,908 170,868 150,816 C131,762 169,723 150,673 C132,620 168,583 150,534 C133,484 167,448 150,402 C135,356 165,323 150,280 C137,239 163,210 150,172 C139,138 161,114 150,82 C141,57 159,39 150,16"
      class="ink-line" fill="none" stroke-width="4" stroke-linecap="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
    >
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="9.0s" fill="freeze" />
    </path>

    <!-- leaves, revealed in sequence as the stem reaches their height, then held -->
    <g opacity="0" transform="translate(128,1063) rotate(32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.89s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="32;29;32" additive="sum" dur="2.6s" begin="1.24s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(172,1002) rotate(-34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.33s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-34;-31;-34" additive="sum" dur="2.75s" begin="1.68s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(128,912) rotate(36)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.98s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="36;33;36" additive="sum" dur="2.9s" begin="2.33s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(172,853) rotate(-38)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.41s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-38;-35;-38" additive="sum" dur="3.05s" begin="2.76s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(129,766) rotate(32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.05s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="32;29;32" additive="sum" dur="3.2s" begin="3.4s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(171,709) rotate(-34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.46s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-34;-31;-34" additive="sum" dur="2.6s" begin="3.81s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(130,625) rotate(36)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.07s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="36;33;36" additive="sum" dur="2.75s" begin="4.42s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(170,569) rotate(-38)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.48s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-38;-35;-38" additive="sum" dur="2.9s" begin="4.83s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(131,488) rotate(32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.07s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="32;29;32" additive="sum" dur="3.05s" begin="5.42s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(169,435) rotate(-34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.45s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-34;-31;-34" additive="sum" dur="3.2s" begin="5.8s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(133,359) rotate(36)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="6.0s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="36;33;36" additive="sum" dur="2.6s" begin="6.35s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(167,311) rotate(-38)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="6.36s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-38;-35;-38" additive="sum" dur="2.75s" begin="6.71s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(135,242) rotate(32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="6.85s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="32;29;32" additive="sum" dur="2.9s" begin="7.2s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(165,199) rotate(-34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="7.17s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-34;-31;-34" additive="sum" dur="3.05s" begin="7.52s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(137,141) rotate(36)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="7.59s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="36;33;36" additive="sum" dur="3.2s" begin="7.94s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(163,105) rotate(-38)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="7.86s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-38;-35;-38" additive="sum" dur="2.6s" begin="8.21s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(139,59) rotate(32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="8.19s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="32;29;32" additive="sum" dur="2.75s" begin="8.54s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <!-- chakra swirl accents: abstract nod to the Naruto energy motif, not a reproduction of any show artwork -->
    <g opacity="0" transform="translate(178,150)">
      <animate attributeName="opacity" from="0" to="0.9" dur="0.4s" begin="8.5s" fill="freeze" />
      <circle r="16" fill="url(#glow)" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" begin="8.5s" repeatCount="indefinite" />
        <use href="#chakraSwirl" stroke="#E8792B" stroke-width="2.5" />
      </g>
    </g>

    <g opacity="0" transform="translate(146,193) rotate(-34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="8.65s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-36;-30;-36" additive="sum" dur="3.3s" begin="8.9s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(160,135) rotate(32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="8.85s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="29;35;29" additive="sum" dur="3s" begin="9.1s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <!-- final small chakra flare marking the top of the vine -->
    <g opacity="0" transform="translate(150,12)">
      <animate attributeName="opacity" from="0" to="0.9" dur="0.4s" begin="9.2s" fill="freeze" />
      <circle r="18" fill="url(#glow)" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.6s" begin="9.2s" repeatCount="indefinite" />
        <use href="#chakraSwirl" stroke="#F2B705" stroke-width="2.5" />
      </g>
    </g>
    </g>
  </g>
</svg>

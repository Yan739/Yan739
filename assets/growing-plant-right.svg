      <animateTransform attributeName="transform" type="rotate" values="-32;-26;-32" additive="sum" dur="3.05s" begin="4.50s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />

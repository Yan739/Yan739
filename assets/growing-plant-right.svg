<svg viewBox="0 0 300 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Climbing plant, grows once, mirrored" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="leaf" d="M0,0 C11,-17 11,-36 0,-52 C-11,-36 -11,-17 0,0 Z" />
    <path id="chakraSwirl" d="M0,0 C9,-2 13,6 7,11 C1,16 -8,12 -8,3 C-8,-7 3,-13 12,-7" fill="none" stroke-linecap="round" />
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8792B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E8792B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Plays once on load, then stays fully grown -->
  <g id="plant">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" />

    <g transform="translate(300,0) scale(-1,1)">
    <!-- pot -->
    <path d="M118,512 L182,512 L172,486 L128,486 Z" fill="#171512" opacity="0.9" />
    <ellipse cx="150" cy="486" rx="27" ry="5" fill="#171512" opacity="0.55" />

    <!-- climbing stem -->
    <path
      id="stem"
      d="M150,486 C130,440 170,410 150,368 C130,326 170,286 150,244
         C132,206 168,178 150,140 C136,110 164,84 150,54 C141,36 158,20 150,8"
      fill="none" stroke="#171512" stroke-width="4" stroke-linecap="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
    >
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="4s" fill="freeze" />
    </path>

    <!-- leaves, revealed in sequence as the stem reaches their height, then held -->
    <g opacity="0" transform="translate(146,452) rotate(-42)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.56s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-45;-39;-45" additive="sum" dur="3.1s" begin="0.9s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#171512" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(170,404) rotate(38)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.28s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="35;41;35" additive="sum" dur="2.7s" begin="1.5s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#171512" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(138,358) rotate(-36)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-38;-32;-38" additive="sum" dur="3.4s" begin="2.3s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#171512" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(165,308) rotate(40)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.64s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="37;43;37" additive="sum" dur="2.9s" begin="2.9s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#171512" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(140,252) rotate(-32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.28s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-34;-28;-34" additive="sum" dur="3.2s" begin="3.5s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#171512" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(163,204) rotate(36)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.84s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="33;39;33" additive="sum" dur="2.8s" begin="4.1s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#171512" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <!-- chakra swirl accents: abstract nod to the Naruto energy motif, not a reproduction of any show artwork -->
    <g opacity="0" transform="translate(178,150)">
      <animate attributeName="opacity" from="0" to="0.9" dur="0.4s" begin="4.32s" fill="freeze" />
      <circle r="16" fill="url(#glow)" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" begin="4.32s" repeatCount="indefinite" />
        <use href="#chakraSwirl" stroke="#E8792B" stroke-width="2.5" />
      </g>
    </g>

    <g opacity="0" transform="translate(146,148) rotate(-34)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.48s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="-36;-30;-36" additive="sum" dur="3.3s" begin="4.7s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#171512" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <g opacity="0" transform="translate(160,96) rotate(32)">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.04s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" values="29;35;29" additive="sum" dur="3s" begin="5.3s" repeatCount="indefinite" />
      <use href="#leaf" fill="#E8792B" />
      <line x1="0" y1="0" x2="0" y2="-48" stroke="#171512" stroke-opacity="0.25" stroke-width="1.5" />
    </g>

    <!-- final small chakra flare marking the top of the vine -->
    <g opacity="0" transform="translate(150,10)">
      <animate attributeName="opacity" from="0" to="0.9" dur="0.4s" begin="5.6s" fill="freeze" />
      <circle r="18" fill="url(#glow)" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.6s" begin="5.6s" repeatCount="indefinite" />
        <use href="#chakraSwirl" stroke="#F2B705" stroke-width="2.5" />
      </g>
    </g>
    </g>
  </g>
</svg>

    <!-- chakra swirl accents: abstract nod to the Naruto energy motif, not a reproduction of any show artwork -->
    <g opacity="0" transform="translate(178,-10)">
      <animate attributeName="opacity" from="0" to="0.9" dur="0.4s" begin="9.80s" fill="freeze" />
      <circle r="16" fill="url(#glow)" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" begin="9.80s" repeatCount="indefinite" />
        <use href="#chakraSwirl" stroke="#E8792B" stroke-width="2.5" />

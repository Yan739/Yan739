    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8792B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E8792B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Plays once on load, then stays fully grown -->
  <g id="plant">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" />

    <!-- pot -->
    <path class="ink-fill" d="M118,1954 L182,1954 L172,1928 L128,1928 Z" opacity="0.9" />
    <ellipse class="ink-fill" cx="150" cy="1928" rx="27" ry="5" opacity="0.55" />

    <!-- climbing stem: the same S-curve rhythm as the original design, repeated 4 times to grow much taller -->
    <path
      id="stem"
      d="M150,1928 C130,1883 170,1851 150,1810 C130,1763 170,1729 150,1686 C132,1646 168,1618 150,1582 C136,1549 164,1526 150,1496 C141,1479 159,1466 150,1450 C170,1405 130,1373 150,1332 C170,1285 130,1251 150,1208 C168,1168 132,1140 150,1104 C164,1071 136,1048 150,1018 C159,1001 141,988 150,972 C130,927 170,895 150,854 C130,807 170,773 150,730 C132,690 168,662 150,626 C136,593 164,570 150,540 C141,523 159,510 150,494 C170,449 130,417 150,376 C170,329 130,295 150,252 C168,212 132,184 150,148 C164,115 136,92 150,62 C159,45 141,32 150,16"
      class="ink-line" fill="none" stroke-width="4" stroke-linecap="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
    >
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="24.0s" fill="freeze" />
    </path>


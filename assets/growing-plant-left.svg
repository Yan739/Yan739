      <animateTransform attributeName="transform" type="rotate" values="-42;-36;-42" additive="sum" dur="2.6s" begin="1.26s" repeatCount="indefinite" />
      <use href="#leaf" fill="#F2B705" />
      <line class="ink-line" x1="0" y1="0" x2="0" y2="-48" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g opacity="0" transform="translate(170,1846) rotate(38)">

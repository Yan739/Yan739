<svg viewBox="0 0 300 1962" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Climbing plant, grows once, full length">
  <style>
    .ink-line { stroke: #171512; }
    .ink-fill { stroke: #171512; fill: #171512; }
    @media (prefers-color-scheme: dark) {
      .ink-line { stroke: #F2B705; }
      .ink-fill { stroke: #F2B705; fill: #F2B705; }
    }
  </style>
  <defs>
    <path id="leaf" d="M0,0 C11,-17 11,-36 0,-52 C-11,-36 -11,-17 0,0 Z" />

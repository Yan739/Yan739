    <circle class="icon" cx="1.2" cy="0" r="1.4" />
    <path class="icon" d="M5.6,3.2 h2.4 v1.3 c0.8,-1.1 2,-1.6 3.4,-1.6 c2.8,0 4.2,1.8 4.2,5 v4.1 h-2.4 v-3.7 c0,-1.7 -0.6,-2.8 -2.2,-2.8 c-1.5,0 -2.4,1 -2.4,2.8 v3.7 h-2.4 z" />
  </g>
  <text x="30" y="14" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="11" font-weight="400" class="txt">LinkedIn</text>
</svg>
